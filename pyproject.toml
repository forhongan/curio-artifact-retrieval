[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curio-retrieval"
version = "0.1.0"
description = "Reproducible Chinese museum object text-to-image retrieval"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pillow>=11,<13", "httpx>=0.28,<1",
  "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3", "torch==2.9.1", "torchvision==0.24.1",
  "transformers>=4.57,<5", "peft>=0.18,<0.19", "accelerate>=1.10,<2",
  "sentencepiece>=0.2,<1", "protobuf>=5,<7", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "tqdm>=4.67,<5", "safetensors>=0.6,<1",
  "imagehash>=4.3,<5", "pandas>=2.2,<3", "pyarrow>=19,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/curio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
